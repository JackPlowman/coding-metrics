name: "Code Checks"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  check-justfile-format:
    name: Check Justfile Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Check Justfile Format
        run: just format-check

        shell: bash

  check-markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Create PR review comments and manage PR labels.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Markdown links
        uses: UmbrellaDocs/action-linkspector@v1.5.5
        with:
          github_token: ${{ github.token }}
          config_file: .github/tool-configurations/.linkspector.yml
          reporter: github-pr-review
          fail_on_error: true
          filter_mode: nofilter
          show_stats: true

  prek-check:
    name: "Validate Prek Git Hooks Configuration"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run Prek Action
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.10"
          install-only: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prek Check
        run: just prek-check

        shell: bash

  run-actionlint:
    name: Check GitHub Actions with Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Actionlint
        uses: raven-actions/actionlint@v2.2.0
        with:
          version: "1.7.12"
          flags: -color

  run-editorconfig-checker:
    name: Check File Formats with EditorConfig Checker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up EditorConfig Checker
        uses: editorconfig-checker/action-editorconfig-checker@v3.0.0
        with:
          version: v4.0.2
      - name: Run EditorConfig Checker
        run: editorconfig-checker -color -format=github-actions

  run-gitleaks:
    name: Check for Secrets with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Create PR review comments and manage PR labels.
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_NOTIFY_USER_LIST: "@JackPlowman"
      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif

  run-grype:
    name: Check for Vulnerabilities with Grype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current project
        id: scan
        uses: anchore/scan-action@v7.4.2
        with:
          path: "."
        continue-on-error: true
      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
      - name: Scan current project
        uses: anchore/scan-action@v7.4.2
        with:
          path: "."

  run-markdownlint:
    name: "Check Markdown Files with Markdownlint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          config: ".github/tool-configurations/.markdownlint-cli2.jsonc"
          globs: |
            README
            *.md
            **/*.md

  run-prek:
    name: "Run Prek pre-commit hook checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run Prek Action
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.10"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  run-prettier:
    name: "Check Code Formatting with Prettier"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
      - name: Install Prettier
        run: npm install -g prettier@3.10.1 # zizmor: ignore[adhoc-packages]
        shell: bash
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Check Code Formatting with Prettier
        run: just prettier-check

        shell: bash

  run-trivy:
    name: "Check Vulnerabilities, Secrets, Misconfigurations, and Licenses with Trivy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          trivy-config: .github/tool-configurations/trivy.yml
          format: "sarif"
          output: "trivy-results.sarif"
          version: v0.76.2
      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: trivy-results.sarif

  run-trufflehog:
    name: Check for Secrets with TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          extra_args: --results=verified,unknown

  run-yamllint:
    name: "Check YAML Files with Yamllint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Create PR review comments and manage PR labels.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Yamllint"
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_file_or_dir: "."
          yamllint_config_filepath: ".github/tool-configurations/.yaml-lint.yml"
          yamllint_strict: true
          yamllint_comment: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}

  run-zizmor:
    name: Check GitHub Actions with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read action metadata for the workflow security audit.
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          persona: auditor
          version: 1.32.0

  codeql-checks:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload security analysis results to code scanning.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: GitHubSecurityLab/CodeQL-Community-Packs/configs/default.yml@v0.9.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
    strategy:
      matrix:
        language: [actions, go]

  run-go-format-and-lint-checks:
    name: Run Go Format and Lint Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Allow the workflow to create and modify pull request comments
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  run-go-dependency-vulnerability-checks:
    name: Run Go Dependency Vulnerability Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Install Go Vulnerability Checker
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run Go Vulnerability Checker
        run: just vulncheck

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run Unit Tests
        run: go test ./src/...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Build
        run: just build

  go-dependency-submission:
    name: Go Dependency Submission
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allow the workflow to create and modify repository contents
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - name: Run snapshot action
        uses: actions/go-dependency-submission@v2.0.3
        with:
          go-mod-path: go.mod

  test-action:
    name: Test Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare SVG output directory
        run: |
          mkdir -p .test-output
          chmod 777 .test-output
      - name: Run Test Action
        uses: ./ # zizmor: ignore[self-repository] Test the checked-out PR merge commit.
        env:
          TMPDIR: /github/workspace/.test-output
        with:
          github_token: ${{ github.token }}
          github_username: ${{ github.repository_owner }}
          debug: "true"
          test_mode: "true"
          output_file_name: "output.svg"
      - name: Upload Test Action Output
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-action-output
          path: .test-output/output.svg
          if-no-files-found: error
