name: Configure Labels
description: Run Configure Labels for this repository
inputs:
  github-token:
    description: GitHub token for this job
    required: true
runs:
  using: composite
  steps:
    - name: Sync labels
      uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
      with:
        token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        manifest: .github/tool-configurations/labels.yml
