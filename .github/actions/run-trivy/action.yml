name: "Check Vulnerabilities, Secrets, Misconfigurations, and Licenses with Trivy"
description: Run Check Vulnerabilities, Secrets, Misconfigurations, and Licenses with Trivy for this repository
runs:
  using: composite
  steps:
    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: "fs"
        scan-ref: "."
        trivy-config: .github/tool-configurations/trivy.yml
        format: "sarif"
        output: "trivy-results.sarif"
        version: v0.71.2
    - name: Upload Trivy SARIF report
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
      with:
        sarif_file: trivy-results.sarif
