name: Clean GitHub Action Caches
description: Run Clean GitHub Action Caches for this repository
inputs:
  github-token:
    description: GitHub token for this job
    required: true
runs:
  using: composite
  steps:
    - name: Delete caches
      shell: bash
      run: |
        if [[ "${GITHUB_REPOSITORY}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
          gh cache delete --all --repo "${GITHUB_REPOSITORY}"
        else
          echo "Invalid repository name: ${GITHUB_REPOSITORY}"
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
