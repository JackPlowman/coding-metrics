name: Check GitHub Actions with zizmor
description: Run Check GitHub Actions with zizmor for this repository
runs:
  using: composite
  steps:
    - name: Run zizmor 🌈
      uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
      with:
        persona: auditor
        version: 1.26.1
